<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:#04142a}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 50% 0%, rgba(17,72,160,.16), transparent 36%),
    linear-gradient(180deg,#020b18,#04142a 60%,#020b18);
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}
.viewport{
  width:min(100vw, 1100px);
  margin:0 auto;
  position:relative;
  line-height:0;
  box-shadow:0 0 70px rgba(0,0,0,.42);
}
.viewport img{
  width:100%;
  height:auto;
  display:block;
  user-select:none;
  -webkit-user-drag:none;
}
.hotspot{
  position:absolute;
  display:block;
  z-index:10;
  border-radius:14px;
  background:rgba(20,110,255,0);
  transition:.16s ease;
  line-height:normal;
}
.hotspot:hover{
  background:rgba(40,120,255,.05);
  box-shadow:inset 0 0 0 1px rgba(90,165,255,.18),0 0 18px rgba(44,120,255,.10);
}
.hotspot:focus-visible{
  outline:2px solid rgba(90,170,255,.85);
  outline-offset:1px;
}
.anchor{
  position:absolute;
  left:0;
  width:1px;
  height:1px;
  pointer-events:none;
}
.badge{
  position:fixed;
  right:12px;
  bottom:12px;
  z-index:30;
  line-height:1;
  font-size:11px;
  color:#d9ebff;
  padding:8px 10px;
  border-radius:10px;
  border:1px solid rgba(116,177,255,.25);
  background:rgba(4,23,51,.75);
  backdrop-filter:blur(10px);
  opacity:.16;
  transition:.2s;
}
.badge:hover{opacity:.95}
@media(max-width:700px){
  .viewport{width:100vw}
  .badge{display:none}
}
</style>
