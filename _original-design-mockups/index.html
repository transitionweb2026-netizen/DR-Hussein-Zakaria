<title>Dr. Hussein Zakaria — Approved Homepage</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:#d7eafb}
body{
  margin:0;
  background:
    radial-gradient(circle at 50% -10%, rgba(255,255,255,.95), transparent 28%),
    linear-gradient(180deg,#c8e4fb,#dbeefe);
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
}
.frame{
  position:relative;
  width:min(100vw, 1100px);
  margin:0 auto;
  line-height:0;
  box-shadow:0 0 55px rgba(44,104,168,.16);
}
.frame>img{
  display:block;
  width:100%;
  height:auto;
  user-select:none;
  -webkit-user-drag:none;
}
.hotspot{
  position:absolute;
  z-index:10;
  display:block;
  border-radius:999px;
  background:rgba(255,255,255,0);
  line-height:normal;
  outline:none;
}
.hotspot:hover{
  background:rgba(59,139,255,.07);
  box-shadow:inset 0 0 0 1px rgba(33,112,231,.18),0 0 18px rgba(56,138,255,.12);
}
.hotspot:focus-visible{
  background:rgba(59,139,255,.12);
  box-shadow:inset 0 0 0 2px rgba(26,100,220,.7);
}
.anchor{
  position:absolute;
  left:0;
  width:1px;
  height:1px;
  pointer-events:none;
}
.dev-note{
  position:fixed;
  left:14px;
  bottom:14px;
  z-index:50;
  padding:8px 11px;
  border-radius:10px;
  background:rgba(8,33,70,.86);
  color:#fff;
  font-size:11px;
  line-height:1.3;
  backdrop-filter:blur(10px);
  opacity:.18;
  transition:.2s;
}
.dev-note:hover{opacity:.95}
@media(max-width:700px){
  .frame{width:100vw}
  .dev-note{display:none}
}
</style>
</head>
